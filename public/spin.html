<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jackpot Slot Machine</title>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-database-compat.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #0d061f; --text: #ffffff; --yellow: #fbbf24; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding-bottom: 20px; }
        .container { width: 100%; max-width: 400px; padding: 10px; text-align: center; }
        
        .slot-wrapper { 
            position: relative; width: 100%; aspect-ratio: 3/4; 
            background-image: url('https://res.cloudinary.com/dyqegwdme/image/upload/v1787058019/jackpot_xmaool.png'); 
            background-size: cover; background-position: center; 
        }

        .reels-overlay {
            position: absolute; top: 31%; left: 20.5%; width: 59%; height: 28%;
            display: flex; justify-content: space-between; gap: 5px; z-index: 5;
        }
        .reel {
            flex: 1; background: #ffffff; border-radius: 6px; display: flex; align-items: center; justify-content: center;
            font-size: 30px; box-shadow: inset 0 0 10px rgba(0,0,0,0.3); overflow: hidden; color: #000;
        }

        .spin-click-area {
            position: absolute; bottom: 13.5%; left: 28%; width: 44%; height: 9.5%;
            cursor: pointer; z-index: 10;
        }

        .info-box { margin-top: 10px; background: rgba(30, 45, 77, 0.8); padding: 12px; border-radius: 12px; }
        #status-text { font-size: 14px; font-weight: bold; color: var(--yellow); }
        .btn-back { display: inline-block; margin-top: 10px; padding: 8px 20px; border-radius: 8px; background: #1e2d4d; color: #fff; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <div class="slot-wrapper">
            <div class="reels-overlay">
                <div class="reel" id="reel-1">7</div>
                <div class="reel" id="reel-2">7</div>
                <div class="reel" id="reel-3">7</div>
            </div>
            <div class="spin-click-area" onclick="handleSpinAction()"></div>
        </div>

        <div class="info-box">
            <div id="status-text">Free Spins Left: 3</div>
        </div>

        <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Back</a>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const userId = tg.initDataUnsafe?.user?.id || "test_user";

        const AdController = {
            videoBlockId: "29212", 
            showVideoAd: function(onReward, onError) {
                if (window.Adsgram) {
                    const ad = window.Adsgram.init({ blockId: this.videoBlockId });
                    ad.show()
                      .then((result) => { if (onReward) onReward(result); })
                      .catch((err) => { 
                          alert("No ads available right now! Please wait 3 minutes and try again.");
                          if (onError) onError(err); 
                      });
                } else {
                    alert("No ads available right now! Please wait 3 minutes and try again.");
                }
            }
        };

        const symbols = ['🍇', '🔔', '🪙', '7️⃣', '💎', '⭐'];
        let freeSpinsLeft = 3; // ফ্রি স্পিন ৩টি করা হলো
        let userGP = 0;
        let isSpinning = false;
        let adSpinsEarned = 0; // অ্যাড দেখার পর স্পিন কাউন্ট

        function initSpin() {
            db.ref('users/' + userId).on('value', snap => {
                const data = snap.val() || {};
                userGP = data.gp || 0;
                freeSpinsLeft = data.spin_free_left !== undefined ? data.spin_free_left : 3;
                adSpinsEarned = data.spin_ad_earned || 0;
                updateUI();
            });
        }

        function updateUI() {
            const statusText = document.getElementById('status-text');
            if (freeSpinsLeft > 0) {
                statusText.innerText = `Free Spins Left: ${freeSpinsLeft}`;
            } else if (adSpinsEarned > 0) {
                statusText.innerText = `Ad Spins Left: ${adSpinsEarned}`;
            } else {
                statusText.innerText = `Out of free spins! Watch ad to spin.`;
            }
        }

        function handleSpinAction() {
            if (isSpinning) return;

            if (freeSpinsLeft > 0) {
                freeSpinsLeft--;
                db.ref('users/' + userId).update({ spin_free_left: freeSpinsLeft });
                executeSlotSpin();
            } else if (adSpinsEarned > 0) {
                adSpinsEarned--;
                db.ref('users/' + userId).update({ spin_ad_earned: adSpinsEarned });
                executeSlotSpin();
            } else {
                // Trigger Ad
                AdController.showVideoAd(
                    (result) => {
                        adSpinsEarned++;
                        db.ref('users/' + userId).update({ spin_ad_earned: adSpinsEarned });
                        alert("Ad watched successfully! You got 1 spin.");
                        updateUI();
                    },
                    (error) => {}
                );
            }
        }

        function executeSlotSpin() {
            isSpinning = true;
            const r1 = document.getElementById('reel-1');
            const r2 = document.getElementById('reel-2');
            const r3 = document.getElementById('reel-3');

            let counter = 0;
            const roll = setInterval(() => {
                r1.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                r2.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                r3.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                counter++;

                if (counter > 15) {
                    clearInterval(roll);
                    let f1 = symbols[Math.floor(Math.random() * symbols.length)];
                    let f2 = symbols[Math.floor(Math.random() * symbols.length)];
                    let f3 = symbols[Math.floor(Math.random() * symbols.length)];

                    r1.innerText = f1; r2.innerText = f2; r3.innerText = f3;
                    isSpinning = false;

                    let win = 100; // ডিফল্ট ড্র
                    
                    // ৩টি মিললে ১০০০ GP
                    if (f1 === f2 && f2 === f3) {
                        win = 1000;
                        triggerConfetti();
                    } 
                    // যে কোনো ২টি মিললে (যেমন ১ম-২য়, ২য়-৩য় বা ১ম-৩য়)
                    else if (f1 === f2 || f2 === f3 || f1 === f3) {
                        win = Math.random() < 0.5 ? 400 : 200;
                    }

                    const newGP = userGP + win;
                    db.ref('users/' + userId).update({ gp: newGP }).then(() => {
                        alert(`Congratulations! You won ${win} GP!`);
                        updateUI();
                    });
                }
            }, 100);
        }

        function triggerConfetti() {
            confetti({
                particleCount: 120,
                spread: 80,
                origin: { y: 0.6 }
            });
        }

        window.onload = initSpin;
    </script>
</body>
</html>
