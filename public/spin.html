<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Spin - eFootball TM</title>
    <!-- Firebase & SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-database-compat.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Central Config -->
    <script src="config.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #050a18; --card: #121e36; --primary: #3b82f6; --text: #ffffff; --border: #1e2d4d; --yellow: #fbbf24; --green: #22c55e; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; padding-bottom: 90px; }
        
        .top-bar { display: flex; align-items: center; padding: 15px; background: rgba(18, 30, 54, 0.7); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000; }
        .top-bar a { color: white; text-decoration: none; margin-right: 15px; font-size: 16px; }

        .container { padding: 20px; text-align: center; }
        .spin-card { background: linear-gradient(135deg, #121e36, #1a2c50); border-radius: 24px; padding: 25px; border: 1px solid rgba(251, 191, 36, 0.3); box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 20px; position: relative; overflow: hidden; }
        
        /* চাকার ডিজাইন এবং প্রিমিয়াম লেবেল */
        .wheel-container { position: relative; width: 280px; height: 280px; margin: 25px auto; }
        .wheel { 
            width: 100%; height: 100%; border-radius: 50%; border: 8px solid #fbbf24; 
            position: relative; overflow: hidden; 
            transition: transform 4.5s cubic-bezier(0.15, 0.75, 0.1, 1); 
            background: conic-gradient(
                #ef4444 0deg 60deg, 
                #f97316 60deg 120deg, 
                #eab308 120deg 180deg, 
                #22c55e 180deg 240deg, 
                #06b6d4 240deg 300deg, 
                #a855f7 300deg 360deg
            ); 
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.5), inset 0 0 20px rgba(0,0,0,0.4); 
        }

        .wheel-texts {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none;
        }
        .w-text {
            position: absolute; font-size: 13px; font-weight: bold; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.9);
        }
        .wt-1 { top: 22%; left: 62%; transform: rotate(30deg); }
        .wt-2 { top: 44%; left: 75%; transform: rotate(90deg); }
        .wt-3 { top: 68%; left: 60%; transform: rotate(150deg); }
        .wt-4 { top: 70%; left: 30%; transform: rotate(210deg); }
        .wt-5 { top: 44%; left: 16%; transform: rotate(270deg); }
        .wt-6 { top: 22%; left: 32%; transform: rotate(330deg); }

        .wheel-pointer { 
            position: absolute; top: -18px; left: 50%; transform: translateX(-50%); 
            width: 0; height: 0; border-left: 14px solid transparent; 
            border-right: 14px solid transparent; border-bottom: 28px solid #ffffff; 
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6)); z-index: 10; 
        }

        .wheel-center {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 55px; height: 55px; background: radial-gradient(circle, #fbbf24, #d97706);
            border-radius: 50%; border: 4px solid #fff; box-shadow: 0 0 15px rgba(0,0,0,0.6);
            z-index: 5; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px;
        }
        
        .btn-spin { 
            width: 100%; border: none; padding: 16px; border-radius: 14px; color: white; font-weight: bold; cursor: pointer; font-size: 16px; 
            background: linear-gradient(135deg, #f59e0b, #ef4444); 
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4); margin-top: 15px; transition: 0.3s; 
            text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-spin:active { transform: scale(0.96); }
        .btn-spin:disabled { background: #334155; cursor: not-allowed; opacity: 0.7; box-shadow: none; }

        .btn-back { display: block; width: 60%; margin: 15px auto 0 auto; padding: 12px; border-radius: 12px; background: rgba(30, 45, 77, 0.6); border: 1px solid var(--border); color: #ffffff; text-decoration: none; font-weight: bold; font-size: 14px; text-align: center; transition: 0.3s; }
        .btn-back:hover { background: rgba(59, 130, 246, 0.2); border-color: var(--primary); }

        #timer-display { margin-top: 15px; font-size: 16px; font-weight: bold; color: #f87171; display: none; }
        .limit-note { font-size: 11px; color: #94a3b8; margin-top: 15px; line-height: 1.4; }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 70px; background: #070d19; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--border); z-index: 1000; }
        .nav-item { text-align: center; color: #94a3b8; font-size: 11px; text-decoration: none; flex: 1; }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="index.html"><i class="fas fa-chevron-left"></i></a>
        <span>Lucky Spin Wheel</span>
    </div>

    <div class="container">
        <div class="spin-card">
            <i class="fas fa-dharmachakra" style="font-size: 35px; color: var(--yellow); margin-bottom: 8px; filter: drop-shadow(0 0 10px rgba(251,191,36,0.5));"></i>
            <h3 style="margin-bottom: 5px; font-size: 20px; letter-spacing: 0.5px;">Lucky Spin Wheel</h3>
            <p style="font-size: 12px; color: var(--yellow); margin-bottom: 10px;" id="status-text">Free Spins Available</p>
            
            <div class="wheel-container">
                <div class="wheel-pointer"></div>
                <div class="wheel" id="inner-wheel"></div>
                <div class="wheel-texts">
                    <span class="w-text wt-1">500 GP</span>
                    <span class="w-text wt-2">150 GP</span>
                    <span class="w-text wt-3">600 GP</span>
                    <span class="w-text wt-4">1000 GP</span>
                    <span class="w-text wt-5">500 GP</span>
                    <span class="w-text wt-6">600 GP</span>
                </div>
                <div class="wheel-center"><i class="fas fa-star" style="font-size: 18px; color: #fff;"></i></div>
            </div>

            <button id="spin-btn" class="btn-spin" onclick="handleSpinAction()">
                <i class="fas fa-gift"></i> FREE SPIN (2 Left)
            </button>

            <div id="timer-display">
                Next Action In: <span id="countdown">00:00</span>
            </div>

            <div class="limit-note">
                <i class="fas fa-info-circle"></i> First 2 spins are FREE! After that, watch 3 ads to spin. 3 hours cooldown after completing cycle.
            </div>

            <a href="index.html" class="btn-back">
                <i class="fas fa-arrow-left" style="margin-right: 6px;"></i> Back
            </a>
        </div>
    </div>

    <!-- নিচের নেভিগেশন বার -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item" style="color: #3b82f6;"><i class="fas fa-home"></i>Home</a>
        <a href="legend.html" class="nav-item"><i class="fas fa-crown"></i>Legend</a>
        <a href="task.html" class="nav-item"><i class="fas fa-clipboard-check"></i>Earn</a>
        <a href="profile.html" class="nav-item"><i class="fas fa-user-circle"></i>Profile</a>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const userId = tg.initDataUnsafe?.user?.id || "test_user";

        const AdController = {
            videoBlockId: "29212", 
            showVideoAd: function(onReward, onError) {
                if (window.Adsgram) {
                    const ad = window.Adsgram.init({ blockId: this.videoBlockId });
                    ad.show()
                      .then((result) => { if (onReward) onReward(result); })
                      .catch((err) => { if (onError) onError(err); });
                } else {
                    alert("Ad system is loading, please wait.");
                }
            }
        };

        const prizes = [500, 150, 600, 1000, 500, 600]; 
        const cooldownTime = 3 * 60 * 60 * 1000; // ৩ ঘণ্টার কাউন্টডাউন
        const adInterval = 5 * 1000;             // প্রতিটি অ্যাডের মাঝে ৫ সেকেন্ড ওয়েটিং

        let freeSpinsLeft = 2;
        let adsWatched = 0;
        let nextAllowedTime = 0;
        let nextSpinTime = 0;
        let userGP = 0;
        let timerInterval;
        let isSpinning = false;

        function initSpin() {
            db.ref('users/' + userId).on('value', snap => {
                const data = snap.val() || {};
                userGP = data.gp || 0;
                freeSpinsLeft = data.spin_free_left !== undefined ? data.spin_free_left : 2;
                adsWatched = data.spin_ads_count || 0;
                nextAllowedTime = data.spin_next_ad_time || 0;
                nextSpinTime = data.spin_cooldown_time || 0;
                updateUI();
            });
        }

        function updateUI() {
            const now = Date.now();
            const btn = document.getElementById('spin-btn');
            const timerDiv = document.getElementById('timer-display');
            const statusText = document.getElementById('status-text');

            if (now < nextSpinTime) {
                btn.disabled = true;
                timerDiv.style.display = 'block';
                statusText.innerText = "Cooldown Active!";
                startTimer(nextSpinTime - now);
                return;
            } else if (nextSpinTime > 0 && now >= nextSpinTime && freeSpinsLeft === 0 && adsWatched >= 3) {
                db.ref('users/' + userId).update({
                    spin_free_left: 2,
                    spin_ads_count: 0,
                    spin_cooldown_time: 0
                });
                freeSpinsLeft = 2;
                adsWatched = 0;
            }

            if (now < nextAllowedTime) {
                btn.disabled = true;
                timerDiv.style.display = 'block';
                startTimer(nextAllowedTime - now);
                statusText.innerText = `Watch Ad (${adsWatched}/3)`;
                return;
            }

            timerDiv.style.display = 'none';
            btn.disabled = false;

            if (freeSpinsLeft > 0) {
                statusText.innerText = `Free Spins Left: ${freeSpinsLeft}`;
                btn.innerHTML = `<i class="fas fa-gift"></i> FREE SPIN (${freeSpinsLeft} Left)`;
            } else if (adsWatched < 3) {
                statusText.innerText = `Watch Ads to Unlock Spin (${adsWatched}/3)`;
                btn.innerHTML = `<i class="fas fa-play-circle"></i> WATCH AD (${adsWatched + 1}/3)`;
            } else {
                statusText.innerText = `Ready to Spin!`;
                btn.innerHTML = `<i class="fas fa-dharmachakra"></i> SPIN THE WHEEL NOW`;
            }
        }

        function handleSpinAction() {
            if (isSpinning) return;

            const now = Date.now();
            if (now < nextAllowedTime) return;

            if (freeSpinsLeft > 0) {
                freeSpinsLeft--;
                db.ref('users/' + userId).update({
                    spin_free_left: freeSpinsLeft
                });
                executeSpin(false); 
            } 
            else if (adsWatched < 3) {
                AdController.showVideoAd(
                    (result) => {
                        adsWatched++;
                        const nextAdWait = Date.now() + adInterval;
                        
                        db.ref('users/' + userId).update({
                            spin_ads_count: adsWatched,
                            spin_next_ad_time: nextAdWait
                        });

                        if (adsWatched < 3) {
                            alert(`Ad ${adsWatched}/3 watched! Please wait 5 seconds for the next ad.`);
                        } else {
                            alert("All 3 ads watched successfully! Click 'Spin the Wheel Now'.");
                        }
                        updateUI();
                    },
                    (error) => {
                        alert("Ad failed or skipped. Please watch the full ad.");
                    }
                );
            } 
            else {
                executeSpin(true);
            }
        }

        function executeSpin(isFinalCycle) {
            isSpinning = true;
            const btn = document.getElementById('spin-btn');
            btn.disabled = true;

            // সিকোয়েন্স লজিক: প্রথম স্পিনে 500 GP (index 0), দ্বিতীয় স্পিনে নিশ্চিত 600 GP (index 2)
            let winningIndex;
            if (freeSpinsLeft === 1) {
                winningIndex = 0; // 500 GP
            } else if (freeSpinsLeft === 0 && !isFinalCycle) {
                winningIndex = 2; // 600 GP
            } else {
                // অ্যাড দেখার পরের স্পিনগুলোতেও বেশিরভাগ সময় 500 বা 600 GP (ইউজার খুশি রাখতে)
                const luckyRoll = Math.random();
                if (luckyRoll < 0.45) winningIndex = 0; // 500 GP
                else if (luckyRoll < 0.90) winningIndex = 2; // 600 GP
                else if (luckyRoll < 0.95) winningIndex = 4; // 500 GP
                else winningIndex = 3; // 1000 GP জ্যাকপট
            }

            const wonAmount = prizes[winningIndex];

            const degreesPerItem = 360 / prizes.length;
            const extraSpins = 360 * 6; 
            const targetDegree = extraSpins + (360 - (winningIndex * degreesPerItem + degreesPerItem / 2));

            const wheel = document.getElementById('inner-wheel');
            wheel.style.transform = `rotate(${targetDegree}deg)`;

            setTimeout(() => {
                isSpinning = false;
                const newGP = userGP + wonAmount;
                
                let updateData = { gp: newGP };

                if (isFinalCycle) {
                    updateData.spin_cooldown_time = Date.now() + cooldownTime;
                    updateData.spin_next_ad_time = 0;
                }

                db.ref('users/' + userId).update(updateData).then(() => {
                    alert(`🎉 Congratulations! You won ${wonAmount} GP! Added to your profile.`);
                });
            }, 4500); // ৪.৫ সেকেন্ড স্পিন ঘোরার সময়
        }

        function startTimer(remaining) {
            const countdownSpan = document.getElementById('countdown');
            clearInterval(timerInterval);

            let targetTime = Date.now() + remaining;

            timerInterval = setInterval(() => {
                const now = Date.now();
                const diff = targetTime - now;

                if (diff <= 0) {
                    clearInterval(timerInterval);
                    updateUI();
                    return;
                }

                let h = Math.floor(diff / 3600000);
                let m = Math.floor((diff % 3600000) / 60000);
                let s = Math.floor((diff % 60000) / 1000);

                countdownSpan.innerText = 
                    (h > 0 ? h + "h " : "") + 
                    m.toString().padStart(2,'0') + ":" + 
                    s.toString().padStart(2,'0');
            }, 1000);
        }

        window.onload = initSpin;
    </script>
</body>
</html>
