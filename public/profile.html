<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - eFootball HUB</title>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-database-compat.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #070e1e; --card-dark: #121e36; --pink: #d946ef; --text: #ffffff; --border: #1e2d4d; --glacier: #e0f2fe; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; padding: 15px; padding-bottom: 90px; -webkit-tap-highlight-color: transparent; }
        
        .profile-container { 
            background: linear-gradient(135deg, rgba(217, 70, 239, 0.25), rgba(59, 130, 246, 0.25), var(--card-dark)); 
            border-radius: 20px; padding: 30px 20px; text-align: center; border: 1px solid rgba(217, 70, 239, 0.4); 
            margin-bottom: 25px; box-shadow: 0 0 25px rgba(217, 70, 239, 0.15);
        }
        .avatar { width: 85px; height: 85px; border-radius: 50%; border: 3px solid var(--pink); margin-bottom: 12px; box-shadow: 0 0 20px rgba(217, 70, 239, 0.6); object-fit: cover; }
        .name { font-size: 20px; font-weight: bold; margin-bottom: 5px; color: var(--glacier); }
        .user-id { color: #94a3b8; font-size: 12px; background: rgba(0,0,0,0.3); display: inline-block; padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border); }

        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .action-box {
            position: relative; overflow: hidden; border-radius: 16px; padding: 18px 10px; text-align: center;
            border: 1px solid rgba(255,255,255,0.18); text-decoration: none; color: white; cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 5px 0 rgba(0,0,0,0.35), 0 10px 18px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.2);
        }
        .action-box::before {
            content: ""; position: absolute; top: 0; left: 0; right: 0; height: 45%;
            background: linear-gradient(180deg, rgba(255,255,255,0.32), rgba(255,255,255,0)); pointer-events: none;
        }
        .action-box:active { transform: translateY(3px) scale(0.97); }
        .action-box i { font-size: 24px; margin-bottom: 8px; display: block; position: relative; z-index: 1; color: var(--glacier) !important; }
        .action-box span { font-size: 11px; font-weight: bold; text-transform: uppercase; color: var(--glacier); position: relative; z-index: 1; }
        .action-box .value { font-size: 16px; font-weight: bold; margin-top: 4px; color: #ffffff; position: relative; z-index: 1; }

        .box-gp { background: linear-gradient(150deg, #fbbf24, #b45309); }
        .box-task { background: linear-gradient(150deg, #4ade80, #15803d); }
        .box-refer { background: linear-gradient(150deg, #f472b6, #be185d); }
        .box-earn { background: linear-gradient(150deg, #818cf8, #4338ca); }
        .box-wallet { background: linear-gradient(150deg, #60a5fa, #1d4ed8); }
        .box-withdraw { background: linear-gradient(150deg, #f87171, #b91c1c); }
        .box-history { background: linear-gradient(150deg, #a78bfa, #6d28d9); }
        .box-support { background: linear-gradient(150deg, #2dd4bf, #0f766e); }
        .box-admin { background: linear-gradient(150deg, #f87171, #7f1d1d); }

        /* iOS / Clean Bottom Nav */
        .bottom-nav { 
            position: fixed; bottom: 0; left: 0; width: 100%; height: 68px; 
            background: rgba(12, 20, 39, 0.92); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            display: flex; justify-content: space-around; align-items: center; 
            border-top: 1px solid rgba(255, 255, 255, 0.08); z-index: 1000; padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item { 
            text-align: center; color: #94a3b8; font-size: 11px; text-decoration: none; flex: 1; 
            transition: color 0.3s cubic-bezier(0.25, 1, 0.5, 1), transform 0.2s ease; 
        }
        .nav-item i { 
            font-size: 20px; display: block; margin-bottom: 3px; 
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.3s ease; 
        }
        .nav-item:active { transform: scale(0.9); }
        .nav-item.active { color: #ffffff !important; font-weight: 600; }
        .nav-item.active i { transform: translateY(-3px); color: #d946ef; text-shadow: 0 0 10px rgba(217, 70, 239, 0.5); }
    </style>
</head>
<body>
    <div style="height: 10px;"></div>

    <div class="profile-container">
        <img src="https://via.placeholder.com/100" class="avatar" id="user-avatar">
        <div class="name" id="user-name">Loading...</div>
        <div class="user-id" id="user-id">ID: Fetching...</div>
    </div>

    <div class="action-grid" id="action-grid">
        <div class="action-box box-gp"><i class="fas fa-coins"></i><span>Total GP</span><div class="value" id="gp-balance">0</div></div>
        <div class="action-box box-task"><i class="fas fa-check-circle"></i><span>Task Done</span><div class="value" id="total-tasks">0</div></div>
        <a href="refer.html" class="action-box box-refer"><i class="fas fa-user-plus"></i><span>Refer Friends</span><div class="value" style="font-size: 10px; color: var(--glacier);">Get GP Rewards</div></a>
        <a href="earn.html" class="action-box box-earn"><i class="fas fa-gem"></i><span>Earn More</span><div class="value" style="font-size: 10px; color: var(--glacier);">Extra Offers</div></a>
        <a href="wallet.html" class="action-box box-wallet"><i class="fas fa-wallet"></i><span>Wallet Setup</span><div class="value" style="font-size: 10px; color: var(--glacier);">TON Connect</div></a>
        <a href="withdraw.html" class="action-box box-withdraw"><i class="fas fa-hand-holding-usd"></i><span>Withdraw</span><div class="value" style="font-size: 10px; color: var(--glacier);">GP Cashout</div></a>
        <a href="history.html" class="action-box box-history"><i class="fas fa-list-alt"></i><span>History</span><div class="value" style="font-size: 10px; color: var(--glacier);">Log Details</div></a>
        <a href="support.html" class="action-box box-support"><i class="fas fa-headset"></i><span>Support</span><div class="value" style="font-size: 10px; color: var(--glacier);">Get Help</div></a>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fas fa-home" style="color: #60a5fa;"></i>Home</a>
        <a href="legend.html" class="nav-item"><i class="fas fa-crown" style="color: #fbbf24;"></i>Legend</a>
        <a href="task.html" class="nav-item"><i class="fas fa-clipboard-check" style="color: #34d399;"></i>Earn</a>
        <a href="profile.html" class="nav-item active"><i class="fas fa-user-circle" style="color: #d946ef;"></i>Profile</a>
    </nav>

    <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    const user = tg.initDataUnsafe?.user;
    const userId = user?.id ? String(user.id) : "test_user";
    const ADMIN_TELEGRAM_IDS = ["8236917187", "7757851056"]; 

    if (userId) {
        db.ref('users/' + userId).on('value', (snapshot) => {
            const data = snapshot.val() || {};
            document.getElementById('gp-balance').innerText = (data.gp || 0).toLocaleString();
            document.getElementById('total-tasks').innerText = (data.tasks_done || 0).toLocaleString();
        });
    }

    if (user) {
        document.getElementById('user-name').innerText = user.first_name + (user.last_name ? " " + user.last_name : "");
        document.getElementById('user-id').innerText = "ID: #" + user.id;
        if (user.photo_url) document.getElementById('user-avatar').src = user.photo_url;

        if (ADMIN_TELEGRAM_IDS.includes(userId)) {
            const actionGrid = document.getElementById('action-grid');
            const adminBox = document.createElement('a');
            adminBox.href = "admin.html";
            adminBox.className = "action-box box-admin";
            adminBox.style.gridColumn = "span 2";
            adminBox.innerHTML = `<i class="fas fa-user-shield"></i><span>Admin Panel</span><div class="value" style="font-size: 10px; color: #fca5a5;">Control Center</div>`;
            actionGrid.appendChild(adminBox);
        }
    }
    </script>
</body>
</html>
