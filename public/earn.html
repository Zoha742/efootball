<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn More - eFootball HUB</title>
    <!-- Firebase & SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-database-compat.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Central Config -->
    <script src="config.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #050a18; --card: #121e36; --primary: #818cf8; --text: #ffffff; --border: #1e2d4d; --yellow: #fbbf24; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; padding-bottom: 90px; }
        
        .top-bar { display: flex; align-items: center; padding: 15px; background: rgba(18, 30, 54, 0.7); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000; }
        .top-bar a { color: white; text-decoration: none; margin-right: 15px; }

        .container { padding: 20px; text-align: center; }
        .earn-card { background: var(--card); border-radius: 20px; padding: 25px; border: 1px solid var(--border); margin-bottom: 20px; }
        
        /* ডাইনামিক ছবির স্টাইল */
        .earn-img { width: 90px; height: 90px; object-fit: cover; border-radius: 16px; margin-bottom: 15px; border: 2px solid var(--primary); box-shadow: 0 4px 15px rgba(0,0,0,0.4); }

        .status-info { margin-bottom: 20px; font-size: 14px; color: #94a3b8; }
        .status-info b { color: var(--yellow); }

        .btn-earn { 
            width: 100%; border: none; padding: 16px; border-radius: 12px; 
            color: white; font-weight: bold; cursor: pointer; transition: 0.3s; 
            font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-blue { background: linear-gradient(135deg, #818cf8, #6366f1); box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3); }
        .btn-success { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
        .btn-lock { background: #334155; cursor: not-allowed; opacity: 0.8; }

        #timer-display { margin-top: 15px; font-size: 18px; font-weight: bold; color: #f87171; display: none; }
        .limit-note { font-size: 11px; color: #64748b; margin-top: 15px; line-height: 1.4; }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 70px; background: #070d19; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--border); z-index: 1000; }
        .nav-item { text-align: center; color: #94a3b8; font-size: 11px; text-decoration: none; flex: 1; }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="profile.html"><i class="fas fa-chevron-left"></i></a>
        <span>Earn More GP</span>
    </div>

    <div class="container">
        <div class="earn-card">
            <!-- ডাইনামিক ইমেজ ডিসপ্লে -->
            <img id="earn-dynamic-img" src="https://res.cloudinary.com/dyqegwdme/image/upload/v1786994788/1._start_wmufid.png" alt="Earn Step" class="earn-img">
            
            <div class="status-info">
                Daily Task: <b id="ad-count">0</b> / 3 Ads Watched
            </div>

            <button id="earn-btn" class="btn-earn btn-blue" onclick="watchAd()">
                <i class="fas fa-play-circle"></i> WATCH VIDEO AD
            </button>

            <div id="timer-display">
                Next Ad In: <span id="countdown">00:00</span>
            </div>

            <div class="limit-note">
                <i class="fas fa-info-circle"></i> If you watch 3 videos completely in a day, 500 GP will be added to your account at once. After watching each ad, there will be a short waiting time for the next one.
            </div>
        </div>
    </div>

    <!-- নিচের নেভিগেশন বার (হোম ও প্রোফাইলসহ) -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fas fa-home"></i>Home</a>
        <a href="legend.html" class="nav-item"><i class="fas fa-crown"></i>Legend</a>
        <a href="task.html" class="nav-item" style="color: #3b82f6;"><i class="fas fa-clipboard-check"></i>Earn</a>
        <a href="profile.html" class="nav-item"><i class="fas fa-user-circle"></i>Profile</a>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const userId = tg.initDataUnsafe?.user?.id || "test_user";

        // আপনার দেওয়া ৬টি ছবির লিস্ট
        const stepImages = [
            "https://res.cloudinary.com/dyqegwdme/image/upload/v1786994788/1._start_wmufid.png", // ০টি অ্যাড (শুরু)
            "https://res.cloudinary.com/dyqegwdme/image/upload/v1786994788/2._goal_sbspgy.png",  // ১টি অ্যাড দেখা হলে
            "https://res.cloudinary.com/dyqegwdme/image/upload/v1786994788/3._kick_wvbdfw.png", // ২টি অ্যাড দেখা হলে
            "https://res.cloudinary.com/dyqegwdme/image/upload/v1786994787/4.star_zxgufd.png",  // ৩টি পূর্ণ হলে
            "https://res.cloudinary.com/dyqegwdme/image/upload/v1786994787/5.Cup_khdiku.png",    // কাপ ইমেজ
            "https://res.cloudinary.com/dyqegwdme/image/upload/v1786994787/6.Win_ypr6bc.png"    // উইন/কমপ্লিটেড ফাইনাল ইমেজ
        ];

        const AdController = {
            videoBlockId: "29212", 
            showVideoAd: function(onReward, onError) {
                if (window.Adsgram) {
                    const ad = window.Adsgram.init({ blockId: this.videoBlockId });
                    ad.show()
                      .then((result) => { if (onReward) onReward(result); })
                      .catch((err) => { if (onError) onError(err); });
                } else {
                    console.log("Adsgram SDK not loaded yet.");
                }
            }
        };

        let adsWatched = 0;
        let nextAllowedTime = 0;
        let userGP = 0;
        let timerInterval;

        function initEarn() {
            db.ref('users/' + userId).on('value', snap => {
                const data = snap.val() || {};
                userGP = data.gp || 0;
                adsWatched = data.earn_ads_count || 0;
                nextAllowedTime = data.earn_next_time || 0;
                updateUI();
            });
        }

        function updateUI() {
            const now = Date.now();
            document.getElementById('ad-count').innerText = adsWatched;

            // যতগুলো অ্যাড দেখা হয়েছে সেই অনুযায়ী ছবি পরিবর্তন হবে
            const imgElement = document.getElementById('earn-dynamic-img');
            if (adsWatched === 0) {
                imgElement.src = stepImages[0];
            } else if (adsWatched === 1) {
                imgElement.src = stepImages[1];
            } else if (adsWatched === 2) {
                imgElement.src = stepImages[2];
            } else if (adsWatched >= 3) {
                imgElement.src = stepImages[3]; 
            }

            if (now < nextAllowedTime) {
                startTimer(nextAllowedTime - now);
            } else {
                if (adsWatched >= 3) {
                    showLimitReached();
                } else {
                    showReadyState();
                }
            }
        }

        function watchAd() {
            AdController.showVideoAd(
                (result) => { handleReward(); },
                (error) => { alert("Ad failed or skipped. Please try again."); }
            );
        }

        function handleReward() {
            const newCount = adsWatched + 1;
            let reward = 0;

            if (newCount === 3) {
                reward = 500;
            }

            let waitTime = 0;
            if (newCount === 1) waitTime = 1 * 60 * 1000; 
            else if (newCount === 2) waitTime = 3 * 60 * 1000; 
            else if (newCount >= 3) waitTime = 24 * 60 * 60 * 1000; 

            const nextTime = Date.now() + waitTime;

            db.ref('users/' + userId).update({
                gp: userGP + reward,
                earn_ads_count: newCount,
                earn_next_time: nextTime
            }).then(() => {
                if (newCount === 3) {
                    alert(`Congratulations! You have completed 3 ads and earned 500 GP!`);
                } else {
                    alert(`Ad ${newCount}/3 watched successfully!`);
                }
            });
        }

        function startTimer(diff) {
            const btn = document.getElementById('earn-btn');
            const timerDiv = document.getElementById('timer-display');
            const countdownSpan = document.getElementById('countdown');

            btn.disabled = true;
            btn.classList.add('btn-lock');
            btn.innerHTML = `<i class="fas fa-lock"></i> WAIT FOR NEXT AD`;
            timerDiv.style.display = 'block';

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const now = Date.now();
                const remaining = nextAllowedTime - now;

                if (remaining <= 0) {
                    clearInterval(timerInterval);
                    updateUI();
                    return;
                }

                let h = Math.floor(remaining / 3600000);
                let m = Math.floor((remaining % 3600000) / 60000);
                let s = Math.floor((remaining % 60000) / 1000);

                let display = (h > 0 ? h + "h " : "") + (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
                countdownSpan.innerText = display;
            }, 1000);
        }

        function showReadyState() {
            const btn = document.getElementById('earn-btn');
            btn.disabled = false;
            btn.classList.remove('btn-lock', 'btn-success');
            btn.classList.add('btn-blue');
            btn.innerHTML = `<i class="fas fa-play-circle"></i> WATCH VIDEO AD`;
            document.getElementById('timer-display').style.display = 'none';
        }

        function showLimitReached() {
            const btn = document.getElementById('earn-btn');
            const imgElement = document.getElementById('earn-dynamic-img');
            
            // ৩টি অ্যাড দেখা শেষ হলে ফাইনাল উইন বা ৬ নম্বর ছবি সেট হবে
            imgElement.src = stepImages[5]; 

            btn.disabled = true;
            btn.classList.remove('btn-blue', 'btn-lock');
            btn.classList.add('btn-success'); // বাটন সবুজ রঙে রূপ নেবে
            btn.innerHTML = `<i class="fas fa-check-circle"></i> DAILY TASK COMPLETED`;
            document.getElementById('timer-display').style.display = 'block';
        }

        window.onload = initEarn;
    </script>
</body>
</html>
