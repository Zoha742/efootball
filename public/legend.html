<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legends - eFootball HUB</title>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-database-compat.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="config.js"></script>
    <script src="ads_manager_limit.js"></script> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #070e1e; --card-dark: #121e36; --primary: #fbbf24; --text: #ffffff; --border: #1e2d4d; --glacier: #e0f2fe; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; padding: 15px; padding-bottom: 90px; -webkit-tap-highlight-color: transparent; }
        
        .header { display: flex; align-items: center; justify-content: center; position: relative; margin-bottom: 25px; }
        .back-btn { position: absolute; left: 0; font-size: 22px; color: var(--primary); text-decoration: none; }
        
        .pos-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 25px; }
        .pos-btn { background: var(--card-dark); border: 1px solid var(--primary); padding: 12px; text-align: center; border-radius: 8px; cursor: pointer; color: var(--primary); font-weight: bold; font-size: 14px; transition: transform 0.2s ease; }
        .pos-btn:active { transform: scale(0.95); }
        
        .player-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; padding-bottom: 20px; }

        .top-card { 
            background: var(--card-dark); border-radius: 10px; overflow: hidden; border: 1.5px solid var(--primary);
            text-align: center; cursor: pointer; display: flex; flex-direction: column; transition: transform 0.2s;
        }
        .top-card:active { transform: scale(0.95); }
        .top-card img { width: 100%; object-fit: cover; object-position: top; display: block; }
        .top-card p { font-size: 11px; padding: 8px 2px; margin: 0; color: var(--text); background: rgba(18, 30, 54, 0.9); font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* iOS / Clean Colorful Bottom Nav */
        .bottom-nav { 
            position: fixed; bottom: 0; left: 0; width: 100%; height: 68px; 
            background: rgba(12, 20, 39, 0.92); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            display: flex; justify-content: space-around; align-items: center; 
            border-top: 1px solid rgba(255, 255, 255, 0.08); z-index: 1000; padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item { 
            text-align: center; color: #94a3b8; font-size: 11px; text-decoration: none; flex: 1; 
            transition: color 0.3s cubic-bezier(0.25, 1, 0.5, 1), transform 0.2s ease; 
        }
        .nav-item i { 
            font-size: 20px; display: block; margin-bottom: 3px; 
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.3s ease; 
        }
        .nav-item:active { transform: scale(0.9); }
        .nav-item.active { color: #ffffff !important; font-weight: 600; }
        .nav-item.active i { transform: translateY(-3px); color: #fbbf24; text-shadow: 0 0 10px rgba(251, 191, 36, 0.5); }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h2 style="font-size: 18px; color: var(--primary);">LEGENDARY PLAYERS</h2>
    </div>

    <div class="pos-grid">
        <div class="pos-btn" onclick="loadLegends('CF')">CF</div>
        <div class="pos-btn" onclick="loadLegends('SS')">SS</div>
        <div class="pos-btn" onclick="loadLegends('LWF')">LWF</div>
        <div class="pos-btn" onclick="loadLegends('RWF')">RWF</div>
        <div class="pos-btn" onclick="loadLegends('AMF')">AMF</div>
        <div class="pos-btn" onclick="loadLegends('CMF')">CMF</div>
        <div class="pos-btn" onclick="loadLegends('DMF')">DMF</div>
        <div class="pos-btn" onclick="loadLegends('LB')">LB</div>
        <div class="pos-btn" onclick="loadLegends('RB')">RB</div>
        <div class="pos-btn" onclick="loadLegends('CB')">CB</div>
        <div class="pos-btn" onclick="loadLegends('GK')">GK</div>
    </div>

    <div id="legend-container" class="player-grid"></div>
    <div id="banner-container" style="display: flex; justify-content: center; margin-top: 20px; padding-bottom: 20px;"></div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fas fa-home" style="color: #60a5fa;"></i>Home</a>
        <a href="legend.html" class="nav-item active"><i class="fas fa-crown" style="color: #fbbf24;"></i>Legend</a>
        <a href="task.html" class="nav-item"><i class="fas fa-clipboard-check" style="color: #34d399;"></i>Earn</a>
        <a href="profile.html" class="nav-item"><i class="fas fa-user-circle" style="color: #f472b6;"></i>Profile</a>
    </nav>

<script>
    console.log("Database connected successfully!");
    
    async function loadLegends(pos) {
        const container = document.getElementById('legend-container');
        container.innerHTML = "<p style='grid-column: span 3; text-align:center;'>Loading...</p>";
        
        try {
            const response = await fetch('legendplayer.json'); 
            const data = await response.json();
            const all_legends = data.legend || data.players || data; 
            
            const filtered = all_legends.filter(legend => legend.pos === pos);
            container.innerHTML = "";

            if(!filtered || filtered.length === 0) {
                container.innerHTML = "<p style='grid-column: span 3; text-align:center;'>No Data Found!</p>";
                return;
            }

            filtered.forEach(legend => {
                const card = document.createElement('div');
                card.className = 'top-card';
                card.innerHTML = `<img src="${legend.img}"><p>${legend.name}</p>`;
                card.onclick = () => {
                    localStorage.setItem('selected_player', JSON.stringify(legend));
                    window.location.href = 'legendbio.html';
                };
                container.appendChild(card);
            });
        } catch (e) { 
            container.innerHTML = "<p style='grid-column: span 3; text-align:center;'>Error loading legendplayer.json</p>"; 
        }
    } 

    window.onload = () => { loadLegends('CF'); };
</script>
</body>
</html>
