<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw GP - eFootball HUB</title>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-database-compat.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #050a18; --card: #121e36; --border: #1e2d4d; --text: #ffffff; --green: #22c55e; --blue: #3b82f6; --orange: #f59e0b; --red: #ef4444; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px; padding-bottom: 95px; }
        
        .header { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; margin-top: 10px; }
        .back-nav { font-size: 22px; color: white; cursor: pointer; padding: 5px; }

        .balance-box { text-align: center; margin-bottom: 20px; }
        .balance-box h1 {
            font-size: 34px; margin: 5px 0; font-weight: 900;
            background: linear-gradient(90deg, #4ade80, #22c55e, #16a34a);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(34, 197, 94, 0.35);
        }

        .rate-info-box {
            border: 1px solid rgba(239, 68, 68, 0.5);
            background: linear-gradient(145deg, rgba(239,68,68,0.18), rgba(127,29,29,0.25));
            color: #fca5a5;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            display: inline-block;
            margin-top: 5px;
            font-weight: bold;
            box-shadow: 0 3px 10px rgba(239,68,68,0.15), inset 0 1px 0 rgba(255,255,255,0.08);
        }

        .card {
            position: relative; overflow: hidden;
            background: linear-gradient(160deg, #17233f, #0b1224);
            padding: 20px; border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 20px;
            box-shadow: 0 10px 24px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
        }
        .card::before {
            content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, #fbbf24, #f59e0b, #d97706);
        }

        .input-group { margin-bottom: 15px; position: relative; z-index: 1; }
        .input-group label { display: block; font-size: 14px; color: #94a3b8; margin-bottom: 8px; }
        
        #calc-display { color: var(--orange); font-weight: bold; margin-left: 10px; font-size: 13px; }

        .input-group input, .input-group select {
            width: 100%; padding: 12px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            background: linear-gradient(160deg, #0f1830, #0a1226);
            color: white; box-sizing: border-box; outline: none;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.4);
            transition: border-color 0.2s;
        }
        .input-group input:focus, .input-group select:focus { border-color: var(--blue); }

        .withdraw-btn {
            width: 100%; padding: 15px; border-radius: 12px; border: none;
            background: linear-gradient(150deg, #60a5fa, #2563eb);
            color: white; font-weight: bold; cursor: pointer; font-size: 16px;
            box-shadow: 0 5px 0 rgba(29,78,216,0.9), 0 10px 18px rgba(37,99,235,0.35), inset 0 1px 0 rgba(255,255,255,0.25);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            position: relative; z-index: 1;
        }
        .withdraw-btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 rgba(29,78,216,0.9), 0 4px 10px rgba(37,99,235,0.3); }
        .withdraw-btn:disabled { background: #2d3748; box-shadow: none; cursor: not-allowed; opacity: 0.6; }
        
        .history-item {
            position: relative; overflow: hidden;
            background: linear-gradient(160deg, #15213c, #0a1226);
            padding: 15px 15px 15px 18px; border-radius: 12px; margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.08);
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 6px 14px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.05);
        }
        .history-item::before {
            content: ""; position: absolute; top: 0; left: 0; bottom: 0; width: 4px;
            background: linear-gradient(180deg, #fbbf24, #b45309);
        }
        .status-pending { color: var(--orange); font-weight: bold; font-size: 12px; }

        /* নিচে দুইটা কালারফুল 3D বাটন - Home ও Profile */
        .bottom-nav-mini {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 72px;
            display: flex; gap: 10px; padding: 10px 15px;
            background: linear-gradient(180deg, #0f172a, #070d19);
            border-top: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 -6px 20px rgba(0,0,0,0.5);
            box-sizing: border-box; z-index: 1000;
        }
        .nav-mini-item {
            flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
            border-radius: 12px; text-decoration: none; color: #fff; font-weight: bold; font-size: 13px;
            border: 1px solid rgba(255,255,255,0.18);
            box-shadow: 0 4px 0 rgba(0,0,0,0.35), 0 8px 14px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.2);
            transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
        }
        .nav-mini-item i { font-size: 16px; }
        .nav-mini-item:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.35), 0 2px 6px rgba(0,0,0,0.4);
            filter: brightness(1.25);
        }
        .nav-mini-home { background: linear-gradient(150deg, #60a5fa, #2563eb); }
        .nav-mini-profile { background: linear-gradient(150deg, #f0abfc, #a21caf); }
    </style>
</head>
<body>

    <div class="header" style="justify-content: center;">
        <h3 style="margin: 0; font-size: 20px;">Withdraw GP</h3>
    </div>

    <div class="balance-box">
        <p style="color: #94a3b8; margin: 0;">Current Balance</p>
        <h1 id="user-gp">0 GP</h1>
        <!-- এক্সচেঞ্জ রেট বক্স[cite: 6] -->
        <div id="rate-display" class="rate-info-box">Loading Rate...</div>
    </div>

    <div class="card">
        <div class="input-group">
            <!-- ক্যালকুলেটর ডিসপ্লে[cite: 6] -->
            <label>Amount (GP) <span id="calc-display"></span></label>
            <input type="number" id="withdraw-amount" placeholder="Enter amount to withdraw" oninput="validate()">
        </div>
        <div class="input-group">
            <label>Select Wallet / Method</label>
            <select id="wallet-type" onchange="updateAddr()">
                <option value="ton">TON Wallet</option>
                <option value="usdt">USDT (Binance)</option>
            </select>
        </div>
        <div class="input-group">
            <label>Wallet Address</label>
            <input type="text" id="wallet-address" readonly style="color: #94a3b8;">
        </div>
        <button id="withdraw-btn" class="withdraw-btn" onclick="submitWithdraw()" disabled>Withdraw Now</button>
    </div>

    <h4 style="margin-bottom: 10px;"><i class="fas fa-history"></i> Withdraw History</h4>
    <div id="history-list">Loading history...</div>

    <nav class="bottom-nav-mini">
        <a href="index.html" class="nav-mini-item nav-mini-home"><i class="fas fa-home"></i>Home</a>
        <a href="profile.html" class="nav-mini-item nav-mini-profile"><i class="fas fa-user-circle"></i>Profile</a>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        const userId = tg.initDataUnsafe?.user?.id || "test_user";
        let userGP = 0;
        let minLimit = 5000; 
        let exchangeRate = 10000; 

        // ---- Adsgram Interstitial (blockId: int-29249) ----
        // সব পেজ মিলিয়ে ইউজার মোট সর্বোচ্চ ৫টি অ্যাড দেখবে (localStorage এ গোনা হয়)
        const MAX_TOTAL_ADS = 5;
        const AD_COUNT_KEY = 'efootball_total_ads_shown';

        function getAdsShownCount() {
            return parseInt(localStorage.getItem(AD_COUNT_KEY) || '0', 10);
        }
        function incrementAdsShownCount() {
            localStorage.setItem(AD_COUNT_KEY, String(getAdsShownCount() + 1));
        }

        function tryShowInterstitialAd() {
            if (getAdsShownCount() >= MAX_TOTAL_ADS) return;
            if (!window.Adsgram) return;

            const InterstitialController = window.Adsgram.init({ blockId: "int-29249" });
            InterstitialController.show()
                .then(() => {
                    incrementAdsShownCount();
                })
                .catch(() => {
                    // অ্যাড লোড/প্লে করতে সমস্যা - কাউন্ট বাড়ানো হবে না
                });
        }
        tryShowInterstitialAd();

        // ১. অ্যাডমিন প্যানেল থেকে রিয়েল-টাইম ডাটা রিড করা
        db.ref('config').on('value', (snapshot) => {
            const config = snapshot.val();
            if(config) {
                minLimit = parseInt(config.min_limit) || 5000; // আলাদা অপশন: মিনিমাম উইথড্র[cite: 5]
                exchangeRate = parseInt(config.rate) || 10000; // আলাদা অপশন: ডলার রেট[cite: 5]
                
                // উইথড্র পেজে রেট প্রদর্শন[cite: 6]
                document.getElementById('rate-display').innerText = `Rate: ${exchangeRate.toLocaleString()} GP = 10 Dollar`;
                validate(); 
            }
        });

        // ২. ইউজারের ব্যালেন্স এবং ওয়ালেট লোড[cite: 6]
        db.ref('users/' + userId).on('value', snapshot => {
            const data = snapshot.val() || {};
            userGP = data.gp || 0;
            document.getElementById('user-gp').innerText = userGP.toLocaleString() + " GP";
            window.userWallets = data.wallets || {};
            updateAddr();
            validate();
        });

        function updateAddr() {
            const type = document.getElementById('wallet-type').value;
            const savedAddr = window.userWallets ? window.userWallets[type] : null;
            const addrInput = document.getElementById('wallet-address');
            addrInput.value = savedAddr || "Wallet not set! Update in Profile.";
            addrInput.style.color = savedAddr ? "white" : "#ef4444";
            validate();
        }

        // ৩. ক্যালকুলেটর এবং বাটন কন্ট্রোল[cite: 6]
        function validate() {
            const amt = parseInt(document.getElementById('withdraw-amount').value) || 0;
            const addr = document.getElementById('wallet-address').value;
            const btn = document.getElementById('withdraw-btn');
            const calcDisplay = document.getElementById('calc-display');

            // লাইভ ক্যালকুলেটর[cite: 6]
            if (amt > 0) {
                const dollars = (amt / exchangeRate).toFixed(2);
                calcDisplay.innerText = `≈ $${dollars}`;
            } else { calcDisplay.innerText = ""; }

            // বাটন তখনই কাজ করবে যদি অ্যামাউন্ট মিনিমাম লিমিট এর সমান বা বেশি হয়[cite: 6]
            const isAmountValid = (amt >= minLimit && amt <= userGP);
            const isWalletValid = (addr && !addr.includes("not set"));
            
            btn.disabled = !(isAmountValid && isWalletValid);
        }

        function submitWithdraw() {
            const amt = parseInt(document.getElementById('withdraw-amount').value);
            const type = document.getElementById('wallet-type').value;
            const addr = document.getElementById('wallet-address').value;

            if (confirm(`Withdraw ${amt} GP?`)) {
                db.ref('withdraw_requests').push({
                    userId: userId, amount: amt, method: type.toUpperCase(), address: addr, status: 'pending', date: new Date().toLocaleString()
                }).then(() => {
                    db.ref('users/' + userId + '/gp').set(userGP - amt);
                    document.getElementById('withdraw-amount').value = "";
                    alert("Withdraw Submitted!");
                });
            }
        }

        db.ref('withdraw_requests').on('value', snap => {
            let html = "";
            snap.forEach(child => {
                let r = child.val();
                if(r.userId == userId) {
                    html += `<div class="history-item">
                        <div><b>${r.amount} GP</b><br><span class="status-pending">${r.status.toUpperCase()}</span></div>
                        <small style="color:#94a3b8">${r.date}</small>
                    </div>`;
                }
            });
            document.getElementById('history-list').innerHTML = html || "No history found.";
        });
    </script>
</body>
</html>
