<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Tasks - eFootball HUB</title>
    <!-- Firebase & SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-database-compat.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Central Config -->
    <script src="config.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #050a18; --card: #121e36; --primary: #3b82f6; --text: #ffffff; --border: #1e2d4d; --green: #22c55e; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; padding-bottom: 90px; }
        .top-bar { display: flex; align-items: center; padding: 15px; background: rgba(18, 30, 54, 0.7); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000; }
        .top-bar a { color: white; text-decoration: none; margin-right: 15px; }
        .container { padding: 20px; text-align: center; }
        .task-card { background: var(--card); border-radius: 20px; padding: 25px; border: 1px solid var(--border); margin-bottom: 20px; }
        .reward-info i { font-size: 40px; color: #fbbf24; margin-bottom: 10px; }
        .reward-info h2 { margin: 5px 0; color: var(--green); }
        
        .ad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
        .ad-slot { background: #050a18; border: 1px solid var(--border); padding: 8px; border-radius: 12px; font-size: 11px; transition: 0.3s; text-align: center; }
        .ad-slot img { width: 100%; height: 65px; object-fit: cover; border-radius: 8px; margin-bottom: 5px; display: block; border: 1px solid var(--primary); }
        .ad-slot.done { border-color: var(--green); color: var(--green); }
        
        .btn-main { width: 100%; border: none; padding: 15px; border-radius: 12px; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 16px; }
        .btn-blue { background: var(--primary); box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3); }
        .btn-lock { background: #334155; cursor: not-allowed; opacity: 0.8; }
        #timer { font-size: 18px; font-weight: bold; color: #f87171; margin-top: 10px; display: none; }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 70px; background: #070d19; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--border); z-index: 1000; }
        .nav-item { text-align: center; color: #94a3b8; font-size: 11px; text-decoration: none; flex: 1; }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="index.html"><i class="fas fa-chevron-left"></i></a>
        <span>Daily Video Tasks</span>
    </div>

    <div class="container">
        <div class="task-card">
            <div class="reward-info">
                <i class="fas fa-gift"></i>
                <span>Task Reward</span>
                <h2>500 GP Points</h2>
            </div>

            <!-- ৬টি স্লটে বড় সাইজের ছবি -->
            <div class="ad-grid" id="ad-slots">
                <div class="ad-slot" id="slot-1">
                    <img src="https://res.cloudinary.com/dyqegwdme/image/upload/v1786994788/1._start_wmufid.png" alt="Ad 1">
                    <span>Ad 1</span>
                </div>
                <div class="ad-slot" id="slot-2">
                    <img src="https://res.cloudinary.com/dyqegwdme/image/upload/v1786994788/2._goal_sbspgy.png" alt="Ad 2">
                    <span>Ad 2</span>
                </div>
                <div class="ad-slot" id="slot-3">
                    <img src="https://res.cloudinary.com/dyqegwdme/image/upload/v1786994788/3._kick_wvbdfw.png" alt="Ad 3">
                    <span>Ad 3</span>
                </div>
                <div class="ad-slot" id="slot-4">
                    <img src="https://res.cloudinary.com/dyqegwdme/image/upload/v1786994787/4.star_zxgufd.png" alt="Ad 4">
                    <span>Ad 4</span>
                </div>
                <div class="ad-slot" id="slot-5">
                    <img src="https://res.cloudinary.com/dyqegwdme/image/upload/v1786994787/5.Cup_khdiku.png" alt="Ad 5">
                    <span>Ad 5</span>
                </div>
                <div class="ad-slot" id="slot-6">
                    <img src="https://res.cloudinary.com/dyqegwdme/image/upload/v1786994787/6.Win_ypr6bc.png" alt="Ad 6">
                    <span>Ad 6</span>
                </div>
            </div>

            <button id="task-btn" class="btn-main btn-blue" onclick="handleTask()">WATCH AD (1/6)</button>
            <div id="timer">Next Ad In: <span id="countdown">00:05</span></div>
        </div>
    </div>

    <!-- নিচের নেভিগেশন বার (হোম ও প্রোফাইলসহ) -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fas fa-home"></i>Home</a>
        <a href="legend.html" class="nav-item"><i class="fas fa-crown"></i>Legend</a>
        <a href="task.html" class="nav-item" style="color: #3b82f6;"><i class="fas fa-clipboard-check"></i>Earn</a>
        <a href="profile.html" class="nav-item"><i class="fas fa-user-circle"></i>Profile</a>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const userId = tg.initDataUnsafe?.user?.id || "test_user";

        const slotImages = [
            "https://res.cloudinary.com/dyqegwdme/image/upload/v1786994788/1._start_wmufid.png",
            "https://res.cloudinary.com/dyqegwdme/image/upload/v1786994788/2._goal_sbspgy.png",
            "https://res.cloudinary.com/dyqegwdme/image/upload/v1786994788/3._kick_wvbdfw.png",
            "https://res.cloudinary.com/dyqegwdme/image/upload/v1786994787/4.star_zxgufd.png",
            "https://res.cloudinary.com/dyqegwdme/image/upload/v1786994787/5.Cup_khdiku.png",
            "https://res.cloudinary.com/dyqegwdme/image/upload/v1786994787/6.Win_ypr6bc.png"
        ];

        const AdController = {
            videoBlockId: "29212", 
            showVideoAd: function(onReward, onError) {
                if (window.Adsgram) {
                    const ad = window.Adsgram.init({ blockId: this.videoBlockId });
                    ad.show()
                      .then((result) => { if (onReward) onReward(result); })
                      .catch((err) => { if (onError) onError(err); });
                } else {
                    alert("Ad system is loading, please wait.");
                }
            }
        };

        let adsWatched = 0;
        let userGP = 0;
        let nextAllowedTime = 0;
        let timerInterval;
        const adCooldown = 5 * 1000;              // প্রতিটি অ্যাডের মাঝে ৫ সেকেন্ড ওয়েটিং টাইম
        const finalCooldown = 3 * 60 * 60 * 1000;  // ৬টি শেষ হলে ৩ ঘণ্টার কাউন্টডাউন

        function initTask() {
            db.ref('users/' + userId).on('value', snap => {
                const data = snap.val() || {};
                userGP = data.gp || 0;
                adsWatched = data.task_ads_count || 0;
                nextAllowedTime = data.task_next_time || 0;
                const isCompleted = data.task_completed || false;
                const lastCollect = data.last_task_collect || 0;
                const now = Date.now();

                if (isCompleted && (now - lastCollect < finalCooldown)) {
                    startFullCooldownTimer(lastCollect + finalCooldown);
                } else {
                    if (isCompleted && (now - lastCollect >= finalCooldown)) {
                        db.ref('users/' + userId).update({ task_completed: false, task_ads_count: 0 });
                        adsWatched = 0;
                    }
                    updateUIRestore();
                }
            });
        }

        function handleTask() {
            const now = Date.now();
            if (now < nextAllowedTime) {
                alert("Please wait for the 5-second timer to finish!");
                return;
            }

            if (adsWatched < 6) {
                AdController.showVideoAd(
                    (result) => {
                        // প্রতিটি সফল অ্যাড দেখার পর Wish শুভেচ্ছা বার্তা ও ডাটা আপডেট
                        adsWatched++;
                        updateSlotUI(adsWatched);
                        
                        const nextWait = Date.now() + adCooldown;
                        db.ref('users/' + userId).update({
                            task_ads_count: adsWatched,
                            task_next_time: nextWait
                        });

                        if (adsWatched === 6) {
                            document.getElementById('task-btn').innerText = "COLLECT 500 GP";
                            document.getElementById('task-btn').style.background = "var(--green)";
                            document.getElementById('timer').style.display = "none";
                        } else {
                            document.getElementById('task-btn').innerText = `WATCH AD (${adsWatched + 1}/6)`;
                            startAdTimer(nextWait);
                        }
                    },
                    (error) => {
                        alert("আপনাকে সম্পূর্ণ ভিডিওটি দেখতে হবে।");
                    }
                );
            } else {
                collectReward();
            }
        }

        function updateSlotUI(num) {
            const slot = document.getElementById(`slot-${num}`);
            if(slot) {
                slot.classList.add('done');
                slot.innerHTML = `<img src="${slotImages[num-1]}" alt="Done"><span>Done</span>`;
            }
        }

        function collectReward() {
            const rewardAmount = 500;
            db.ref('users/' + userId).update({
                gp: userGP + rewardAmount,
                task_completed: true,
                last_task_collect: Date.now(),
                task_next_time: Date.now() + finalCooldown
            }).then(() => {
                // ৬টি অ্যাড কমপ্লিট করে রিਵোর্ড কালেক্ট করার সময় Wish ও জিপি প্রোফাইলে যোগ হওয়ার মেসেজ[cite: 6]
                alert(`Wish You Success! Congratulations, you have successfully completed 6 ads and ${rewardAmount} GP has been added to your profile!`);
                startFullCooldownTimer(Date.now() + finalCooldown);
            });
        }

        function startAdTimer(endTime) {
            const btn = document.getElementById('task-btn');
            const timerDiv = document.getElementById('timer');
            const countdownSpan = document.getElementById('countdown');
            
            btn.disabled = true;
            btn.classList.add('btn-lock');
            timerDiv.style.display = "block";

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const now = Date.now();
                const remaining = endTime - now;

                if (remaining <= 0) {
                    clearInterval(timerInterval);
                    timerDiv.style.display = "none";
                    btn.disabled = false;
                    btn.classList.remove('btn-lock');
                    if(adsWatched < 6) {
                        btn.innerText = `WATCH AD (${adsWatched + 1}/6)`;
                    }
                    return;
                }

                let s = Math.floor((remaining % 60000) / 1000);
                countdownSpan.innerText = `00:${s.toString().padStart(2,'0')}`;
            }, 1000);
        }

        function startFullCooldownTimer(endTime) {
            const btn = document.getElementById('task-btn');
            const timerDiv = document.getElementById('timer');
            const countdownSpan = document.getElementById('countdown');
            
            btn.style.display = "none";
            timerDiv.style.display = "block";

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const now = Date.now();
                const remaining = endTime - now;

                if (remaining <= 0) {
                    clearInterval(timerInterval);
                    initTask();
                    return;
                }

                let h = Math.floor(remaining / 3600000);
                let m = Math.floor((remaining % 3600000) / 60000);
                let s = Math.floor((remaining % 60000) / 1000);
                countdownSpan.innerText = 
                    `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
            }, 1000);
        }

        function updateUIRestore() {
            const now = Date.now();
            document.getElementById('task-btn').style.display = "block";
            document.getElementById('task-btn').style.background = "var(--primary)";
            
            for (let i = 1; i <= 6; i++) {
                const slot = document.getElementById(`slot-${i}`);
                if(slot) {
                    if (i <= adsWatched) {
                        slot.classList.add('done');
                        slot.innerHTML = `<img src="${slotImages[i-1]}" alt="Done"><span>Done</span>`;
                    } else {
                        slot.classList.remove('done');
                        slot.innerHTML = `<img src="${slotImages[i-1]}" alt="Ad ${i}"><span>Ad ${i}</span>`;
                    }
                }
            }

            if (adsWatched === 6) {
                document.getElementById('task-btn').innerText = "COLLECT 500 GP";
                document.getElementById('task-btn').style.background = "var(--green)";
                document.getElementById('timer').style.display = "none";
            } else {
                document.getElementById('task-btn').innerText = `WATCH AD (${adsWatched + 1}/6)`;
                if (now < nextAllowedTime) {
                    startAdTimer(nextAllowedTime);
                } else {
                    document.getElementById('timer').style.display = "none";
                    document.getElementById('task-btn').disabled = false;
                    document.getElementById('task-btn').classList.remove('btn-lock');
                }
            }
        }

        window.onload = initTask;
    </script>
</body>
</html>
